:root{--ink:#14303F;--cream:#FFF8EC;--display:"Fredoka",system-ui,sans-serif;--ui:"Nunito",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%;overflow:hidden;background:#0F4E63;color:#fff;font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#safe{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);visibility:hidden;pointer-events:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:3}
#hud>*{pointer-events:auto}
.btns{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(9,40,56,.55);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);display:grid;place-items:center;cursor:pointer;padding:0;color:#fff}
.icon-btn svg{width:22px;height:22px}
#scoreBox{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);transform:translateX(-50%);text-align:center;pointer-events:none;z-index:3}
#score{display:block;font-family:var(--display);font-weight:700;font-size:40px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
#best{display:inline-flex;align-items:center;gap:5px;margin-top:4px;padding:3px 11px 3px 7px;border-radius:999px;background:rgba(9,40,56,.5);font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}
#best svg{width:16px;height:16px}
.side #score{font-size:52px}
.side #best{font-size:16px}
@media (max-width:360px){#score{font-size:32px}#best{font-size:12px}}
#hint{position:absolute;pointer-events:none;z-index:4;left:0;top:0}
#hand{position:absolute;width:56px;height:56px;margin:-6px 0 0 -18px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
#hand svg{display:block;width:100%;height:100%}
#hintText{position:absolute;transform:translateX(-50%);white-space:nowrap;padding:9px 16px 10px;border-radius:14px;background:#FFF8EC;color:var(--ink);font-family:var(--display);font-weight:700;font-size:19px;box-shadow:0 5px 0 rgba(0,0,0,.18),0 10px 24px rgba(0,0,0,.25)}
#toast{position:absolute;left:50%;top:40%;transform:translateX(-50%);max-width:calc(100% - 24px);padding:9px 15px;border-radius:13px;background:rgba(8,24,34,.9);font-weight:900;font-size:15px;line-height:1.25;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;z-index:6}
#toast.show{opacity:1}
#modal{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(5,28,40,.55);z-index:10}
.card{width:min(360px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px 20px 18px;border-radius:24px;background:#FFF8EC;color:var(--ink);text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18),0 20px 50px rgba(0,0,0,.35);animation:pop .28s cubic-bezier(.2,1.4,.5,1)}
.card.wide{width:min(560px,100%)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1}
.card p{margin:0 0 12px;font-weight:800;font-size:15.5px;line-height:1.35;color:#3A5260}
.card .big{margin:2px 0 4px;font-family:var(--display);font-weight:700;font-size:52px;line-height:1;color:#14303F;font-variant-numeric:tabular-nums}
.card .sub{margin:0 0 14px;font-weight:900;font-size:15px;color:#56707E}
.catch{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 14px;padding:8px 12px;border-radius:16px;background:#EAF4F2;font-weight:900;font-size:15px;color:#2E5A63}
.catch canvas{width:46px;height:46px;flex:none}
.catch b{display:block;font-family:var(--display);font-weight:700;font-size:20px;color:#14303F;line-height:1.05}
.catch span{text-align:left}
.badge{display:inline-block;margin:0 0 12px;padding:4px 12px;border-radius:999px;background:#FFD24A;color:#5A3D00;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.mbtns{display:flex;flex-direction:column;gap:10px}
.mb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 16px;border:0;border-radius:16px;font:inherit;font-weight:900;font-size:18px;cursor:pointer;color:#fff;background:#2E8B87;box-shadow:0 4px 0 #1C5F5C}
.mb:active{transform:translateY(3px);box-shadow:0 1px 0 #1C5F5C}
.mb.ad{background:#F2A532;box-shadow:0 4px 0 #A9741A;color:#3B2600}
.mb.ad:active{box-shadow:0 1px 0 #A9741A}
.mb.warn{background:#D9573F;box-shadow:0 4px 0 #8E2F1E}
.mb svg{width:24px;height:24px;flex:none}
.mb small{display:block;font-size:12px;font-weight:800;opacity:.85}
.mb:disabled{opacity:.45;cursor:default}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 14px}
.theme{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px 8px 10px;border:0;border-radius:16px;background:#F1E8D8;color:var(--ink);font:inherit;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(20,48,63,.08);text-align:left}
.theme canvas{width:100%;aspect-ratio:16/10;border-radius:10px;display:block}
.theme b{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.1;padding:0 2px}
.theme small{font-size:12px;font-weight:800;color:#6A7E88;padding:0 2px}
.theme.on{background:#DDF1EC;box-shadow:inset 0 0 0 3px #2E8B87}
.theme.locked canvas{filter:saturate(.25) brightness(.85)}
#adFake{position:absolute;inset:0;display:grid;place-items:center;background:#000;color:#fff;font-weight:900;font-size:18px;z-index:20;letter-spacing:.06em}
.cover #hud,.cover #scoreBox,.cover #hint,.cover #toast{display:none !important}
</style>

<script>
/* Lobster Merge: circle physics, merging, scoring (no DOM).
   Tank units: inner tank is TW x TH, origin top-left, y down. Verlet integration with sub-steps
   and positional constraint solving, which stays stable for tall piles of circles. */

    if (document.hidden) { save(true); G.press = null; G.keys = {}; if (AC && AC.state === "running") AC.suspend(); if (gameplayOn) sdkGame("gameplayStop"); }
    else { if (gameplayOn) sdkGame("gameplayStart"); }
  });
  window.addEventListener("pagehide", function () { save(true); });
  window.addEventListener("blur", function () { G.keys = {}; });
  var rzT = 0;
  window.addEventListener("resize", function () { clearTimeout(rzT); rzT = setTimeout(function () { measure(); placeToast(); G.press = null; }, 60); });

  /* ===================== Boot ===================== */
  function initSDK() {
    if (!(window.CrazyGames && window.CrazyGames.SDK)) return Promise.resolve();
    return Promise.resolve().then(function () { return window.CrazyGames.SDK.init(); })
      .then(function () {
        SDK = window.CrazyGames.SDK;
        try {
          if (SDK.game && SDK.game.settings) sdkMute = !!SDK.game.settings.muteAudio;
          if (SDK.game && SDK.game.addSettingsChangeListener) SDK.game.addSettingsChangeListener(function (s) { sdkMute = !!(s && s.muteAudio); setVolume(); });
        } catch (e) {}
      })
      .catch(function () { SDK = null; });
  }
  function fontsReady() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    return Promise.race([
      Promise.all([document.fonts.load("700 30px Fredoka"), document.fonts.load("600 20px Fredoka"), document.fonts.load("900 15px Nunito"), document.fonts.load("800 15px Nunito")]),
      new Promise(function (r) { setTimeout(r, 1500); })
    ]).catch(function () {});
  }
  function boot() {
    lastAdAt = now() - 60;
    initSDK().then(function () {
      sdkGame("loadingStart");
      load(readSave());
      return fontsReady();
    }).then(function () {
      sdkGame("loadingStop");
      measure();
      if (COVER) { bootCover(); return; }
      placeToast();
      resumeOrStart();
      requestAnimationFrame(frame);
    });
  }

  /* ===================== Store covers ===================== */
  // the cover pile (found by video/chain_search.js): a crab dropped on its crab sets off crab > starfish > puffer > lobster > octopus > seal
  var PILE = [[8, 116], [10, 272], [6, 239], [7, 100], [5, 204], [3, 60], [4, 178], [1, 226], [2, 285], [0, 271], [1, 369]];
  function bootCover() {
    document.body.classList.add("cover"); $("app").classList.add("cover");
    var land = COVER === "landscape", sq = COVER === "square", th = THEMES[0];
    // a settled pile, built with the real physics (merging off so the line-up stays put)
    LM.P.noMerge = true; LM.P.overT = 1e9;
    var g = LM.newGame(7), seq = PILE;
    seq.forEach(function (q, i) { var b = LM.drop(g, q[1]); b.tier = q[0]; b.r = R[q[0]]; b.born = -9; for (var f = 0; f < 50; f++) LM.step(g, STEP); });
    for (var f2 = 0; f2 < 240; f2++) LM.step(g, STEP);
    g.bodies.forEach(function (b) { b.ox = b.x; b.oy = b.y; b.oa = b.angle; b.over = 0; });
    g.warn = 0; g.cur = 4; g.next = 2; g.maxTier = 10;
    G.g = g; G.state = "play"; G.readyAt = -1; G.alpha = 1;
    var ext = land ? { s: H * 0.94 / EXT_H } : sq ? { s: H * 0.66 / EXT_H } : { s: Math.min(W * 0.9 / EXT_W, H * 0.66 / EXT_H) };
    var s = ext.s, l = { s: s, side: false };
    l.ox = land ? W * 0.72 - TW * s / 2 : W / 2 - TW * s / 2;
    l.oy = land ? H * 0.03 - TOPU * s : sq ? H * 0.04 - TOPU * s : H - EXT_H * s - H * 0.02 - TOPU * s;
    l.deckY = l.oy + BASEU * s;
    L = l; sprites = {}; bgCache = backCache = frontCache = null;
    // claw holding a crab right over the crab in the pile
    var crab = g.bodies.filter(function (b) { return b.tier === 4; })[0];
    G.clawX = G.target = crab ? crab.x : 200;
    function paint() {
      var c = ctx; clock = 2.2;
      c.setTransform(DPR, 0, 0, DPR, 0, 0);
      var th0 = th;
      paintScene(c, th0, W, H);
      paintTankBack(c, th0);
      c.save(); c.beginPath(); c.rect(ux(0), uy(0), TW * s, TH * s); c.clip();
      drawRays(c, th0, 1.3); drawWeed(c, 1.1);
      g.bodies.forEach(function (b) { drawCreature(c, b.tier, ux(b.x), uy(b.y), R[b.tier] * s, b.angle, 1); });
      drawWater(c, th0, 0.7);
      // merge sparkle between the two shrimps' spot: a fresh pop on the octopus-lobster seam
      var oct = g.bodies.filter(function (b) { return b.tier === 1; })[0];
      if (oct) {
        var rng = LM.mulberry32(5), px = ux(oct.x), py = uy(oct.y);
        for (var k = 0; k < 9; k++) { var a = rng() * TAU, d = (oct.r + 6 + rng() * 14) * s, ss = (3 + rng() * 4) * s; c.fillStyle = k % 2 ? "#FFF1BC" : "#FFFFFF"; c.save(); c.translate(px + Math.cos(a) * d, py + Math.sin(a) * d); c.rotate(a); c.beginPath(); c.moveTo(0, -ss); c.lineTo(ss * 0.35, 0); c.lineTo(0, ss); c.lineTo(-ss * 0.35, 0); c.closePath(); c.fill(); c.restore(); }
      }
      c.restore();
      paintTankFront(c, th0);
      G.dropT = -9; G.readyAt = -1;
      drawClaw(c, 2.2);
      // title
      var fsz = land ? H * 0.2 : sq ? H * 0.13 : W * 0.2;
      var lines = sq ? ["Lobster Merge"] : ["Lobster", "Merge"];
      var tx = land ? W * 0.05 : W / 2, ty = land ? H * 0.28 : sq ? H * 0.79 : H * 0.05;
      c.textAlign = land ? "left" : "center"; c.textBaseline = "top"; c.font = "700 " + fsz + "px Fredoka, sans-serif";
      lines.forEach(function (ln, i) {
        var yy = ty + i * fsz * 0.98;
        c.lineJoin = "round"; c.lineWidth = fsz * 0.17; c.strokeStyle = "#0E3A4C";
        c.save(); c.translate(0, fsz * 0.085); c.strokeText(ln, tx, yy); c.fillStyle = "#0E3A4C"; c.fillText(ln, tx, yy); c.restore();
        c.strokeText(ln, tx, yy);
        var gr = c.createLinearGradient(0, yy, 0, yy + fsz);
        if (i === 0 && !sq) { gr.addColorStop(0, "#FF8A6E"); gr.addColorStop(1, "#E23B2D"); } else { gr.addColorStop(0, "#FFD25E"); gr.addColorStop(1, "#FF8A3D"); }
        c.fillStyle = gr; c.fillText(ln, tx, yy);
      });
    }
    paint();
    requestAnimationFrame(paint);
  }

  if (DEBUG) window.__lm = {
    state: function () { var g = G.g; return { score: g.score, best: S.best, bestTier: S.bestTier, over: g.over, state: G.state, drops: g.drops, merges: g.merges, n: g.bodies.length, maxTier: g.maxTier, warn: g.warn, cur: g.cur, next: g.next, revived: g.revived || 0, modal: !$("modal").hidden, ready: clock >= G.readyAt, claw: G.clawX }; },
    geo: function () { return { ox: L.ox, oy: L.oy, s: L.s, side: L.side, next: L.next, strip: L.strip, ring: L.ring }; },
    drop: function (x) { return tryDrop(x); },
    step: function (n) { for (var i = 0; i < (n || 1) && G.state === "play"; i++) tick(); },
    newGame: function (seed) { startGame(seed); },
    set: function (o) { Object.assign(S, o); bgCache = backCache = frontCache = null; updateHUD(); },
    S: function () { return S; },
    G: function () { return G.g; },
    fill: function (list) { list.forEach(function (q) { var b = LM.drop(G.g, q[1]); if (!b) return; b.tier = q[0]; b.r = R[q[0]]; b.born = -9; b.ox = b.x; b.oy = q[2] !== undefined ? q[2] : b.y; if (q[2] !== undefined) { b.y = b.py = q[2]; } }); },
    sfx: function (k) { audioInit(); sfx(k, { tier: 3, chain: 2 }); return !!AC && AC.state; },
    clock: function () { return clock; },
    pile: function () { return PILE; },
    aim: function (x) { G.target = G.clawX = x; },
    clearFx: function () { resetFx(); G.floats = []; }
  };
  boot();
})();
</script>
